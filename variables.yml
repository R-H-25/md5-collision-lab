# Variables generated randomly for EACH sandbox (APG = Automatic Problem Generation).
# They are available in the Ansible provisioning and are used as per-student flags.
student_id:
  type: username

prefix_len:            # length (bytes) of each student's prefix.txt (never a multiple of 64)
  type: port
  min: 70
  max: 250
  prohibited: [128, 192]

task1_flag:
  type: password
  length: 16
task2_flag:
  type: password
  length: 16
task3_flag:
  type: password
  length: 16
task4_flag:
  type: password
  length: 16
task5_flag:
  type: password
  length: 16
task6_flag:
  type: password
  length: 16
